# The dashboard's `provision node` button, k8s edition. On this deployment the button
# does NOT spawn a process (a child would share the pod's network namespace — see
# provision.py); it PATCHes this StatefulSet's scale subresource through the API server,
# authenticated as this ServiceAccount. The Role below is the entire blast radius:
# get/patch on the scale of the one named StatefulSet, nothing else — no pod exec, no
# secret reads, no deletes. See src/raftkv/k8s_provision.py for the code it authorizes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raftkv-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raftkv-provisioner
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["node"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raftkv-provisioner
subjects:
  - kind: ServiceAccount
    name: raftkv-provisioner
    namespace: default   # where `kubectl apply -f` with no -n puts everything above
roleRef:
  kind: Role
  name: raftkv-provisioner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: raftkv-hl
spec:
  clusterIP: None            # headless: gives each pod a stable DNS name
  selector: { app: raftkv }
  ports: [{ name: http, port: 8000 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: node
spec:
  serviceName: raftkv-hl
  # Pods are node-1..node-N rather than the default <name>-0..N-1, so k8s node ids match
  # the compose/run-local convention and `make k8s-forward` maps node-N ↔ 800N.
  # `ordinals.start` is stable since k8s 1.31; the Makefile pins kind at v1.33.1.
  ordinals: { start: 1 }
  replicas: 3
  selector: { matchLabels: { app: raftkv } }
  template:
    metadata: { labels: { app: raftkv } }
    spec:
      # The identity the provision button acts as; its permissions are exactly the
      # raftkv-provisioner Role above. The token mount this brings is also one half of
      # k8s_provision.py's "demonstrably a pod" check.
      serviceAccountName: raftkv-provisioner
      securityContext:
        fsGroup: 1000        # PVC + emptyDir mounts group-writable (gid 1000 = image 'raft' group);
                             # kind's 0777 provisioner hides this, real clusters don't
        runAsNonRoot: true
        runAsUser: 10000     # high UID (Snyk SNYK-CC-K8S-11); writes go via fsGroup-writable mounts
        runAsGroup: 10000
      containers:
        - name: raftkv
          image: raftkv:local
          imagePullPolicy: Never        # kind: use the side-loaded image
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # only /data (PVC) and /var/log/raftkv (emptyDir) are writable
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          ports: [{ containerPort: 8000 }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # The BOOTSTRAP size, deliberately not `replicas`. Pods 1..N form the
            # initial cluster; every pod above that is a scale-out. Leave this at 3
            # when you scale the StatefulSet -- raising it would hand a running
            # cluster a second, conflicting idea of who votes.
            - name: RAFT_BOOTSTRAP
              value: "3"
            # The provision button works here too, but through the orchestrator, not
            # through process spawning (which provision.py refuses inside a pod anyway:
            # a child would share this pod's network namespace and be unreachable from
            # its peers). RAFT_PROVISION_K8S swaps the backend: the endpoint PATCHes
            # this StatefulSet's scale subresource as the raftkv-provisioner
            # ServiceAccount — the same verb as `make k8s-scale`, authenticated and
            # RBAC-bounded by the Role at the top of this file. Explicit opt-in, never
            # runtime-detected; the backend refuses anywhere that is not demonstrably a
            # pod (see k8s_provision.py).
            - name: RAFT_PROVISION_ENABLED
              value: "1"
            - name: RAFT_PROVISION_K8S
              value: "1"
          command: ["/bin/sh", "-c"]
          args:
            - |
              export RAFT_NODE_ID="$POD_NAME"
              # Every pod, not just the scaled-out ones: a node writes its OWN address
              # into the configuration, and that entry replicates. An empty one leaves
              # a later-joined member holding a voter it can never dial.
              export RAFT_ADVERTISE="$POD_NAME.raftkv-hl:8000"
              ORD="${POD_NAME##*-}"
              if [ "$ORD" -gt "$RAFT_BOOTSTRAP" ]; then
                # `kubectl scale` created this pod. A replica is a PROCESS, not a
                # cluster member: membership is a configuration entry in the
                # replicated log (§6), so this pod starts with no peers, never
                # campaigns, and is invisible to the cluster until a leader appends
                # a config entry naming it. That is the whole reason scaling Raft is
                # two steps and scaling a stateless Deployment is one.
                export RAFT_LEARNER=1
              else
                PEERS=""
                i=1
                while [ "$i" -le "$RAFT_BOOTSTRAP" ]; do
                  NAME="node-$i"
                  if [ "$NAME" != "$POD_NAME" ]; then
                    PEERS="${PEERS:+$PEERS,}$NAME=$NAME.raftkv-hl:8000"
                  fi
                  i=$((i+1))
                done
                export RAFT_PEERS="$PEERS"
              fi
              exec uvicorn --factory raftkv.app:create_app --host 0.0.0.0 --port 8000
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
            # k8s defaults timeoutSeconds to 1, which a Python event loop can miss
            # under a host CPU spike — observed tripping "context deadline exceeded"
            # and recycling healthy pods. 3s tolerates the spike; a node that is
            # genuinely wedged still fails 3 consecutive probes and is replaced.
            timeoutSeconds: 3
          # Readiness alone cannot fix the state it now detects. A node whose apply loop
          # has died needs RESTARTING, not just removing from the Service: it keeps
          # heartbeating, so no follower can elect around it, and the cluster stays wedged
          # behind a member that is present and useless. Without a livenessProbe nothing
          # ever restarts that pod. That is exactly what /livez reports.
          #
          # NOT /healthz, which readiness reads. The two endpoints answer different
          # questions: /healthz answers "treat as serving?" — so it 503s during a
          # simulated crash, and a killed node SHOULD go NotReady and look down to the
          # demo — while /livez answers "beyond self-repair?", and a simulated crash is
          # recoverable by /admin/recover alone. Liveness pointed at /healthz turned the
          # dashboard's kill button into a ~30s self-resurrection: 3 x 10s of failed
          # probes, kubelet restart, and the fresh process boots with crashed=False —
          # un-killed with no admin action. A REALLY dead process fails /livez anyway,
          # by refusing the connection; only the deliberate crash is exempted.
          #
          # Deliberately slacker than readiness. Taking a node out of rotation is cheap and
          # reversible; killing it costs an election, so it should take sustained failure —
          # 3 x 10s here versus 3 x 5s above.
          livenessProbe:
            httpGet: { path: /livez, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /var/log/raftkv }   # writable under readOnlyRootFilesystem
      volumes:
        - { name: logs, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 100Mi } }
