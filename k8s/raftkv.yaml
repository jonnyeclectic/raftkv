apiVersion: v1
kind: Service
metadata:
  name: raftkv-hl
spec:
  clusterIP: None            # headless: gives each pod a stable DNS name
  selector: { app: raftkv }
  ports: [{ name: http, port: 8000 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raftkv
spec:
  serviceName: raftkv-hl
  replicas: 3
  selector: { matchLabels: { app: raftkv } }
  template:
    metadata: { labels: { app: raftkv } }
    spec:
      securityContext:
        fsGroup: 1000        # PVC + emptyDir mounts group-writable (gid 1000 = image 'raft' group);
                             # kind's 0777 provisioner hides this, real clusters don't
        runAsNonRoot: true
        runAsUser: 10000     # high UID (Snyk SNYK-CC-K8S-11); writes go via fsGroup-writable mounts
        runAsGroup: 10000
      containers:
        - name: raftkv
          image: raftkv:local
          imagePullPolicy: Never        # kind: use the side-loaded image
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # only /data (PVC) and /var/log/raftkv (emptyDir) are writable
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          ports: [{ containerPort: 8000 }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # The BOOTSTRAP size, deliberately not `replicas`. Pods 0..N-1 form the
            # initial cluster; every pod above that is a scale-out. Leave this at 3
            # when you scale the StatefulSet -- raising it would hand a running
            # cluster a second, conflicting idea of who votes.
            - name: RAFT_BOOTSTRAP
              value: "3"
          command: ["/bin/sh", "-c"]
          args:
            - |
              export RAFT_NODE_ID="$POD_NAME"
              # Every pod, not just the scaled-out ones: a node writes its OWN address
              # into the configuration, and that entry replicates. An empty one leaves
              # a later-joined member holding a voter it can never dial.
              export RAFT_ADVERTISE="$POD_NAME.raftkv-hl:8000"
              ORD="${POD_NAME##*-}"
              if [ "$ORD" -ge "$RAFT_BOOTSTRAP" ]; then
                # `kubectl scale` created this pod. A replica is a PROCESS, not a
                # cluster member: membership is a configuration entry in the
                # replicated log (§6), so this pod starts with no peers, never
                # campaigns, and is invisible to the cluster until a leader appends
                # a config entry naming it. That is the whole reason scaling Raft is
                # two steps and scaling a stateless Deployment is one.
                export RAFT_LEARNER=1
              else
                PEERS=""
                i=0
                while [ "$i" -lt "$RAFT_BOOTSTRAP" ]; do
                  NAME="raftkv-$i"
                  if [ "$NAME" != "$POD_NAME" ]; then
                    PEERS="${PEERS:+$PEERS,}$NAME=$NAME.raftkv-hl:8000"
                  fi
                  i=$((i+1))
                done
                export RAFT_PEERS="$PEERS"
              fi
              exec uvicorn --factory raftkv.app:create_app --host 0.0.0.0 --port 8000
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
            # k8s defaults timeoutSeconds to 1, which a Python event loop can miss
            # under a host CPU spike — observed tripping "context deadline exceeded"
            # and recycling healthy pods. 3s tolerates the spike; a node that is
            # genuinely wedged still fails 3 consecutive probes and is replaced.
            timeoutSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /var/log/raftkv }   # writable under readOnlyRootFilesystem
      volumes:
        - { name: logs, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 100Mi } }
