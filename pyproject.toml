[project]
name = "raftkv"
version = "0.1.0"
description = "Observable Raft-replicated key-value store"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mockito==2.0.4",
    "pytest-mockito==0.0.6.post1",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raftkv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
